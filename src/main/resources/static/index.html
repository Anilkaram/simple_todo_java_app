<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Todo Application</h1>
        
        <!-- Add Todo Form -->
        <form th:action="@{/add}" th:object="${newTodo}" method="post" class="mb-4">
            <div class="input-group">
                <input type="text" th:field="*{title}" class="form-control" placeholder="Add a new todo..." required>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>
        
        <!-- Todo List -->
        <div class="list-group">
            <div th:each="todo : ${todos}" class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" th:checked="${todo.completed}" onclick="window.location.href='/toggle/' + [[${todo.id}]]" class="form-check-input me-2">
                    <span th:class="${todo.completed} ? 'text-decoration-line-through text-muted' : ''" th:text="${todo.title}"></span>
                </div>
                <a th:href="@{/delete/{id}(id=${todo.id})}" class="btn btn-sm btn-danger">Delete</a>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="mt-3 text-muted">
            <span th:text="${#lists.size(todos)}"></span> total, 
            <span th:text="${#lists.select(todos, t -> !t.completed).size()}"></span> remaining
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
